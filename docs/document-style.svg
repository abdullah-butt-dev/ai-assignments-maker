<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" rx="28" fill="#F8FAFC"/><rect x="225" y="45" width="450" height="430" rx="8" fill="white" stroke="#DCE3EC"/><text x="270" y="105" font-family="Arial" font-size="30" font-weight="700" fill="#1B2A4A">Assignment title</text><line x1="270" y1="125" x2="630" y2="125" stroke="#0E7C7B" stroke-width="3"/><text x="270" y="170" font-family="Arial" font-size="20" font-weight="700" fill="#1B2A4A">Section heading</text><line x1="270" y1="180" x2="630" y2="180" stroke="#0E7C7B" stroke-width="1"/><text x="270" y="220" font-family="Arial" font-size="15" fill="#595959">Clean body text with generous spacing.</text><text x="270" y="245" font-family="Arial" font-size="15" fill="#595959">Simple bullets keep the document skimmable.</text><rect x="270" y="275" width="360" height="75" rx="5" fill="#EAF2F1"/><rect x="270" y="275" width="5" height="75" fill="#0E7C7B"/><text x="292" y="310" font-family="Arial" font-size="14" font-style="italic" fill="#595959">Quotes, scripts and examples</text><text x="292" y="333" font-family="Arial" font-size="14" font-style="italic" fill="#595959">live in a light-teal callout block.</text><text x="270" y="390" font-family="Arial" font-size="16" font-weight="700" fill="#0E7C7B">Why this fits</text><text x="390" y="390" font-family="Arial" font-size="14" font-style="italic" fill="#595959">clean, minimal and easy to scan.</text></svg>
